# Version bumps are driven by `release-please-config.json`, which uses the
# `simple` release type plus explicit `extra-files` entries — deliberately NOT
# `release-type: rust`. The Rust strategy writes a literal `version` into every
# member's `[package]` table and into the root `Cargo.toml`. This workspace is
# virtual (no root `[package]`) and every crate inherits its version via
# `version.workspace = true`, so that strategy aborts with
# "value at path package.version is not tagged". The TOML/JSON updaters below
# bump the single source of truth in `[workspace.package]` instead, plus the
# `amigo-*` entries in `Cargo.lock` (CI builds with `--locked`).
# `scripts/version-consistency.mjs` guards those invariants.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Create/update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # PAT is required so the auto-merged release PR triggers a follow-up
          # workflow run that creates the tag and GitHub Release. Pushes made
          # with the default GITHUB_TOKEN do not trigger further workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  auto-merge:
    name: Auto-merge release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge on release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch

  build:
    name: Build release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/release-build.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
