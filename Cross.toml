# Forward the pinned signing public keys into the cross build container;
# plugin-runtime/build.rs and core/build.rs refuse a release build without them.
[build.env]
passthrough = ["AMIGO_REGISTRY_PUBKEY_HEX", "AMIGO_UPDATE_PUBKEY_HEX"]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y --no-install-recommends libclang-dev protobuf-compiler && rm -rf /var/lib/apt/lists/*",
]
