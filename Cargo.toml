[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/extractors",
    "crates/plugin-runtime",
    "crates/server",
    "crates/cli",
    "tauri",
]
default-members = [
    "crates/core",
    "crates/extractors",
    "crates/plugin-runtime",
    "crates/server",
    "crates/cli",
]

# Release profile tuned for runtime speed and small binaries.
# `[profile.*]` is only honored in the workspace root and applies to all members.
# `panic = "abort"` is safe here: the codebase has no catch_unwind / std::panic
# recovery and rquickjs surfaces JS errors as Err, not via unwinding. It only
# affects the release profile, so `cargo test` (test profile) is unaffected —
# but do not run `cargo test --release`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/amigo-labs/amigo-downloader"
homepage = "https://github.com/amigo-labs/amigo-downloader"
authors = ["amigo-labs"]
description = "Fast, modular download manager in Rust — HTTP, Usenet, HLS/DASH, with a TypeScript plugin system and a responsive Web UI."

[workspace.lints.clippy]
# Modern-idiom guard: every lint below flags code that has a newer, stable
# std/language replacement. Clippy's default groups already cover the rest
# (collapsible_if → let chains, manual_div_ceil, io_other_error, ...).
# Members opt in with `[lints] workspace = true`.
allow_attributes = "warn"                # #[allow] → #[expect(.., reason)]
allow_attributes_without_reason = "warn"
non_std_lazy_statics = "warn"            # once_cell / lazy_static → LazyLock
manual_let_else = "warn"                 # match { .. => return } → let-else
manual_is_variant_and = "warn"           # .map(f).unwrap_or_default() → is_some_and
manual_ok_or = "warn"
manual_midpoint = "warn"
uninlined_format_args = "warn"
borrow_as_ptr = "warn"                   # &x as *const T → &raw const x
ref_as_ptr = "warn"
duration_suboptimal_units = "warn"       # from_secs(3600) → Duration::from_hours(1)
unnested_or_patterns = "warn"            # Some(A) | Some(B) → Some(A | B)
unchecked_time_subtraction = "warn"      # Instant - Duration can panic on underflow

[workspace.dependencies]
# Async runtime. Feature set is the union of what the member crates actually
# use (rt-multi-thread is mandatory: plugin-runtime relies on block_in_place,
# which panics on a current-thread runtime). This drops `process` and `io-std`
# from the old `full`. Test builds restore `full` via dev-dependencies.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "io-util",
    "time",
    "net",
    "signal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }

# TLS
native-tls = "0.2"
tokio-native-tls = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Password hashing + CSPRNG
argon2 = "0.5"
rand = "0.10"

# Plugin-registry + self-update signing
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"

# Versioning & Updates
semver = "1"
sha2 = "0.10"
hex = "0.4"
self-replace = "1"
tempfile = "3"

# Async trait
async-trait = "0.1"

# JS runtime for YouTube N-parameter challenge
rquickjs = { version = "0.14", features = ["bindgen", "parallel"] }

# HLS/DASH manifest parsing
m3u8-rs = "6"
dash-mpd = "0.17"

# HTML parsing
scraper = "0.22"
url = "2"

# Internal crates
amigo-core = { path = "crates/core" }
amigo-extractors = { path = "crates/extractors" }
amigo-plugin-runtime = { path = "crates/plugin-runtime" }
