[package]
name = "krake-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Runs plugin JavaScript out of the daemon process (#79). Spawned by
# `PluginLoader`; ships next to `krake-server` and `krake`.
[[bin]]
name = "krake-plugin-host"
path = "src/bin/krake-plugin-host.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
regex = "1"
url = "2"
urlencoding = "2"
scraper = "0.22"
semver = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = { workspace = true }
tempfile = { workspace = true }

# AES-CBC encryption/decryption for plugins
aes = "0.8"
cbc = "0.1"

# Ed25519 signature verification for the plugin registry (index.json.sig).
ed25519-dalek = { workspace = true }

# QuickJS-NG runtime (replaces rune)
rquickjs = { workspace = true }

# Runs the plugin guest (QuickJS as WebAssembly, crates/plugin-guest). Only
# the runtime: the module is precompiled by build.rs, so no compiler ships.
wasmtime = { version = "50", default-features = false, features = ["runtime", "std"] }

# TypeScript → JavaScript transpilation via SWC
swc_common = "26"
swc_ecma_parser = "45"
swc_ecma_ast = "29"
swc_ecma_codegen = "32"
swc_ecma_transforms_typescript = "55"
swc_ecma_visit = "29"

[build-dependencies]
# Precompiles the plugin guest for the target (`all-arch`: also when cross
# compiling). Same version as the runtime dependency above.
wasmtime = { version = "50", default-features = false, features = ["runtime", "std", "cranelift", "all-arch"] }

[dev-dependencies]
# Signing keypair for registry-signature tests — `ed25519-dalek` exposes
# `SigningKey` only with the `rand_core` feature enabled.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["full"] }
libc = "0.2"
wiremock = "0.6"
