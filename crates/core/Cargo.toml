[package]
name = "amigo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
native-tls = { workspace = true }
tokio-native-tls = { workspace = true }
crc32fast = "1"
regex = "1"
toml = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
self-replace = { workspace = true }
tempfile = { workspace = true }
m3u8-rs = { workspace = true }
dash-mpd = { workspace = true }
unrar = "0.5"
# Maintained successor of sevenz-rust (RUSTSEC-2026-0245/-0246). Decompression only;
# ppmd/bzip2 cover the common non-LZMA 7z codecs.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "ppmd", "bzip2"] }
zip = "2"
async-trait = { workspace = true }
rand = "0.10"
base64 = "0.22"
quick-xml = "0.37"

[dev-dependencies]
# `compress` lets the unit tests build 7z fixtures (incl. hostile entry names).
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "compress"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
wiremock = "0.6"
