# The plugin guest: QuickJS compiled to WebAssembly (wasm32-unknown-unknown).
#
# Not a workspace member: it only builds for Wasm. `krake-plugin-runtime`'s
# build script builds it and embeds the module; `wasmtime` runs it inside
# `krake-plugin-host` (docs/specs/plugin-wasm-guest.md).
[package]
name = "krake-plugin-guest"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No `parallel` (the target has no threads) and no `bindgen` (bindings for
# this target ship pregenerated).
rquickjs = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
panic = "abort"
strip = true

[workspace]
