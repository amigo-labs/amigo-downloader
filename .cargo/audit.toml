# cargo-audit configuration.
#
# Ignored advisories are unmaintained-crate / unsound warnings on
# transitive dependencies that we can't fix from this repository — they
# will close out as upstream moves to maintained replacements (Tauri 3 /
# GTK4, dash-mpd switching off backoff, SWC dropping unic-*).
#
# Ignore real vulnerabilities only with explicit justification. New
# entries should reference an upstream issue or a follow-up task.

[advisories]
ignore = [
    # Tauri 2 still uses GTK3 bindings on Linux. Closes when Tauri moves
    # to GTK4 (planned for Tauri 3); these are all unmaintained-only,
    # not actual vulnerabilities.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib unsoundness in VariantStrIter — Tauri only
    # Other unmaintained transitive deps with no easy bump:
    "RUSTSEC-2024-0370", # proc-macro-error — deep transitive
    "RUSTSEC-2024-0384", # instant — deep transitive (many crates still use it)
    "RUSTSEC-2025-0012", # backoff — pulled by dash-mpd
    "RUSTSEC-2025-0057", # fxhash — deep transitive
    "RUSTSEC-2025-0119", # number_prefix — pulled by indicatif
    # SWC's TypeScript transformer chain still pulls the unic-* family:
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # rand 0.7.3 unsoundness — only triggered when a custom logger calls
    # rand::rng() recursively. Reachable copy is a deep transitive in
    # the SWC chain; we don't install a custom logger that uses rand.
    "RUSTSEC-2026-0097",
    # quick-xml DoS advisories (quadratic attribute scan / unbounded
    # namespace allocation). Fixed in quick-xml >=0.41, but no consumer
    # in our tree resolves to it yet: dash-mpd/pssh-box (DASH MPD parser)
    # still pin quick-xml 0.37, and tauri-utils pins 0.38 — both are
    # transitive and can't be bumped from this repo until those crates
    # release. Remove once dash-mpd and Tauri move to quick-xml >=0.41.
    "RUSTSEC-2026-0194", # quick-xml quadratic run time on duplicate attrs
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace allocation (NsReader)
    # zip 4.6.1 extraction advisories (fixed in zip >=9). Our own code is on
    # zip 9; the remaining copy is pulled only by tauri-plugin-updater (desktop
    # build, Windows target only), whose latest release (2.14.0) still pins
    # zip ^4. Upstream already moved to zip 9 (tauri-apps/plugins-workspace
    # #3698) but has not published it yet (#3712). The updater extracts the
    # MSI/NSIS zip only after verifying its minisign signature against the
    # pubkey in tauri.conf.json, so the archive is not attacker-controlled;
    # the SUID/SGID and Unix-permission issues do not apply on Windows.
    # Remove once a tauri-plugin-updater release depends on zip >=9.
    "RUSTSEC-2026-0367", # zip SUID/SGID bits preserved on extraction
    "RUSTSEC-2026-0368", # zip extract() creates symlinks outside the target
    "RUSTSEC-2026-0369", # zip extract() applies permissions through symlinks
    # zvariant / zvariant_derive / zbus_names were merged into zbus 6 and are
    # unmaintained-only (no vulnerability). They come in via
    # tauri-plugin-notification -> notify-rust 4 -> zbus 5 (desktop build,
    # Linux D-Bus notifications); notify-rust 4.18.2 is the latest release and
    # still uses zbus 5. Remove once notify-rust moves to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
