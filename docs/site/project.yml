# Content for amigo-labs.dev/downloader/ — format: https://github.com/amigo-labs/website/blob/main/docs/project-data.md
# Versions, download links and release notes come from GitHub Releases; don't write them here.
schema: 1
slug: downloader
name: amigo-downloader
status: beta
accent: "#9be22d"
monogram: Dl
icon: icon.png
tagline:
  en: The download manager power users actually want
  de: Der Download-Manager, den Power-User wirklich wollen
summary:
  en: >-
    A fast, modular download manager in Rust: multi-chunk HTTP, native Usenet with PAR2 repair,
    HLS, DASH and YouTube, and a sandboxed TypeScript plugin system. One binary with a Web UI,
    a CLI and a Tauri desktop app.
  de: >-
    Ein schneller, modularer Download-Manager in Rust: Multi-Chunk-HTTP, natives Usenet mit
    PAR2-Reparatur, HLS, DASH und YouTube sowie ein abgeschottetes TypeScript-Plugin-System.
    Ein einziges Binary mit Web-Oberfläche, CLI und Tauri-Desktop-App.
about:
  en: |
    Run it as a Docker container or a single binary on a server, or install the native desktop app
    for Windows, macOS and Linux. The server, the plugins and the Web UI come bundled; metadata,
    queue and history live in an embedded SQLite database, so there is no external service to set up.

    The Web UI is a responsive Svelte app that also installs as a PWA: share a link from your phone
    and it lands in the queue. A REST API and a WebSocket stream real-time progress to scripts and
    other tools.
  de: |
    Läuft als Docker-Container oder einzelnes Binary auf einem Server, oder als native Desktop-App
    für Windows, macOS und Linux. Server, Plugins und Web-Oberfläche sind gebündelt; Metadaten,
    Warteschlange und Verlauf liegen in einer eingebetteten SQLite-Datenbank, es muss also kein
    externer Dienst eingerichtet werden.

    Die Web-Oberfläche ist eine responsive Svelte-App, die sich auch als PWA installieren lässt:
    Einen Link vom Handy teilen, und er landet in der Warteschlange. Eine REST-API und ein WebSocket
    liefern den Fortschritt in Echtzeit an Skripte und andere Tools.
platforms: [docker, windows, macos, linux]
license: MIT
links:
