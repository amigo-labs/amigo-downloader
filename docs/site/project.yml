  - label: { en: Architecture, de: Architektur }
    url: https://github.com/amigo-labs/amigo-downloader/blob/main/docs/architecture.md

highlights:
  - value: "8×"
    label: { en: parallel chunks per download, de: parallele Chunks pro Download }
  - value: "5"
